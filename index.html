
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145d38">
<title>可樂旅遊｜文宣商品辨識</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f3f7f4;color:#173b2a;
  font-family:system-ui,"Noto Sans TC",sans-serif
}
.app{
  max-width:600px;margin:auto;min-height:100dvh;
  display:flex;flex-direction:column
}
header{
  padding:18px 20px;background:#145d38;
  color:white;font-size:19px;font-weight:750
}
.main{padding:18px;flex:1}
.viewer{
  background:#13221c;position:relative;
  aspect-ratio:3/4;max-height:65dvh;
  border-radius:20px;overflow:hidden;
  display:flex;align-items:center;
  justify-content:center;color:#e8f4ec
}
video{width:100%;height:100%;object-fit:cover}
.guide{
  position:absolute;left:7%;right:7%;top:40%;
  height:20%;border:2px solid #b2f2bd;
  border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 999px #0003
}
.guide:after{
  content:"將單一商品名稱置於框內";
  position:absolute;bottom:-34px;width:100%;
  text-align:center;color:white;font-size:13px;
  text-shadow:0 1px 5px #000
}
.center{text-align:center;padding:24px}
.center p{font-size:14px;line-height:1.7}
.btn{
  background:#167647;color:white;border:0;
  border-radius:12px;padding:15px 20px;
  font-size:17px;font-weight:700;width:100%;
  cursor:pointer
}
.btn:disabled{opacity:.5}
.alt{
  display:block;text-align:center;margin-top:12px;
  font-size:14px;color:#2b6e4c;
  cursor:pointer;padding:8px
}
.alt input{display:none}
.status{
  font-size:14px;color:#426554;
  line-height:1.65;min-height:28px;margin:12px 2px
}
.result{
  background:white;border:1px solid #d8e5dc;
  border-radius:12px;padding:14px;margin:10px 0
}
.result b{display:block;margin-bottom:6px}
.result a{
  display:block;margin-top:10px;
  color:#167647;font-weight:700
}
.small{font-size:12px;color:#648072}
.footer{
  font-size:12px;color:#6a8071;
  text-align:center;padding:12px
}
.hide{display:none!important}
</style>
</head>

<body>
<div class="app">
  <header>可樂旅遊｜文宣商品辨識</header>

  <main class="main">
    <div class="viewer" id="viewer">
      <video id="camera" autoplay playsinline muted class="hide"></video>

      <div id="intro" class="center">
        <div style="font-size:48px">▣</div>
        <h2>掃描文宣，立即找商品</h2>
        <p>將鏡頭對準文宣上的單一商品名稱<br>
        辨識成功後自動開啟官網商品頁</p>
      </div>

      <div id="guide" class="guide hide"></div>
    </div>

    <p class="status" id="status" role="status">正在準備商品資料…</p>

    <button id="action" class="btn">開啟相機</button>

    <label class="alt">
      無法開啟相機？改用拍照／相簿
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>

    <div id="results" aria-live="polite"></div>
  </main>

  <div class="footer">
    照片僅在手機上進行辨識，不會上傳至伺服器。
  </div>
</div>

<canvas id="capture" class="hide"></canvas>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
const $ = id => document.getElementById(id);
const products = [];

let stream = null;
let worker = null;
let busy = false;
let dataReady = false;
let cameraReady = false;

const status = message => {
  $("status").textContent = message;
};

function normalize(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/([一二三四五六七八九十])日/g, (_, d) => {
      const nums = {
        一:"1",二:"2",三:"3",四:"4",五:"5",
        六:"6",七:"7",八:"8",九:"9",十:"10"
      };
      return (nums[d] || d) + "日";
    })
    .replace(/[\s\p{P}\p{S}]/gu, "");
}

function similarity(a, b) {
  a = normalize(a);
  b = normalize(b);

  if (!a || !b) return 0;
  if (a === b) return 1;

  if (a.includes(b)) {
    return Math.min(1, b.length / a.length + 0.25);
  }

  if (b.includes(a)) {
    return Math.min(0.8, a.length / b.length);
  }

  const pairs = s => {
    const result = new Set();
    for (let i = 0; i < s.length - 1; i++) {
      result.add(s.slice(i, i + 2));
    }
    return result;
  };

  const x = pairs(a);
  const y = pairs(b);

  let hits = 0;
  for (const item of x) {
    if (y.has(item)) hits++;
  }

  return (2 * hits) / Math.max(1, x.size + y.size);
}

function rank(text) {
  const lines = text.split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);

  const pieces = [...lines];

  for (let i = 0; i < lines.length - 1; i++) {
    pieces.push(lines[i] + lines[i + 1]);
  }

  if (!pieces.length) pieces.push(text);

  return products.map(product => ({
    ...product,
    score: Math.max(
      ...pieces.map(piece => similarity(piece, product.short))
    )
  })).sort((a, b) => b.score - a.score);
}

async function loadProducts() {
  try {
    if (typeof XLSX === "undefined") {
      throw new Error("Excel 解析工具載入失敗");
    }

    status("正在讀取商品對照表…");

    const response = await fetch(
      "./A.xlsx?v=" + Date.now(),
      {cache:"no-store"}
    );

    if (!response.ok) {
      throw new Error("找不到 A.xlsx，HTTP " + response.status);
    }

    const buffer = await response.arrayBuffer();
    const workbook = XLSX.read(buffer, {type:"array"});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});

    const records = rows
      .filter(row => row["可樂報名稱"] && row["網址"])
      .map(row => ({
        short:String(row["可樂報名稱"]).trim(),
        name:String(row["商品名稱"] || "").trim(),
        url:String(row["網址"]).trim()
      }))
      .filter(row => {
        try {
          const url = new URL(row.url);
          return url.protocol === "https:" &&
            url.hostname === "tour.colatour.com.tw";
        } catch {
          return false;
        }
      });

    products.splice(0, products.length, ...records);
    dataReady = products.length > 0;

    if (!dataReady) {
      status("商品資料為空，請檢查 Excel 欄位與網址。");
      return;
    }

    status("已載入 " + products.length + " 支商品，準備掃描。");
  } catch (error) {
    dataReady = false;
    status("商品資料載入失敗：" + error.message);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  cameraReady = false;
}

async function startCamera() {
  if (stream) return;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("此瀏覽器不支援相機，請使用 HTTPS 網址");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    const video = $("camera");
    video.srcObject = stream;
    await video.play();

    video.classList.remove("hide");
    $("intro").classList.add("hide");
    $("guide").classList.remove("hide");

    cameraReady = true;
    $("action").textContent = "辨識商品";

    if (dataReady) {
      status("已載入 " + products.length +
        " 支商品，請對準商品名稱並點擊「辨識商品」。");
    } else {
      status("相機已啟動，但商品資料尚未成功載入。");
    }
  } catch (error) {
    stopCamera();
    status("相機無法啟動：" + error.message +
      "。可改用下方拍照／相簿。");
  }
}

function captureGuide() {
  const video = $("camera");
  const viewer = $("viewer");
  const guide = $("guide");
  const canvas = $("capture");

  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("相機尚未準備好");
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const boxW = viewer.clientWidth;
  const boxH = viewer.clientHeight;

  // object-fit:cover 對應的實際影像縮放
  const scale = Math.max(boxW / vw, boxH / vh);
  const displayW = vw * scale;
  const displayH = vh * scale;
  const offsetX = (displayW - boxW) / 2;
  const offsetY = (displayH - boxH) / 2;

  const rect = guide.getBoundingClientRect();
  const base = viewer.getBoundingClientRect();

  let sx = (rect.left - base.left + offsetX) / scale;
  let sy = (rect.top - base.top + offsetY) / scale;
  let sw = rect.width / scale;
  let sh = rect.height / scale;

  sx = Math.max(0, sx);
  sy = Math.max(0, sy);
  sw = Math.min(sw, vw - sx);
  sh = Math.min(sh, vh - sy);

  // 放大截取區域，改善小字辨識
  const factor = 2;
  canvas.width = Math.round(sw * factor);
  canvas.height = Math.round(sh * factor);

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(
    video, sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  return canvas;
}

function showResults(ranked) {
  const container = $("results");
  container.innerHTML = "";

  const matches = ranked.filter(x => x.score >= 0.3).slice(0, 5);

  if (!matches.length) {
    container.textContent =
      "找不到相符商品。請靠近商品名稱重新掃描，或確認商品已建檔。";
    return;
  }

  for (const product of matches) {
    const div = document.createElement("div");
    div.className = "result";

    const title = document.createElement("b");
    title.textContent = product.short;

    const name = document.createElement("div");
    name.textContent = product.name;

    const score = document.createElement("div");
    score.className = "small";
    score.textContent =
      "文字相似度 " + Math.round(product.score * 100) +
      "%（非辨識正確率）";

    const link = document.createElement("a");
    link.href = product.url;
    link.textContent = "開啟這支商品";

    div.append(title, name, score, link);
    container.append(div);
  }
}

async function scan(source) {
  if (busy) return;

  if (!dataReady) {
    status("商品資料尚未載入，無法進行比對。");
    return;
  }

  busy = true;
  $("action").disabled = true;
  $("results").innerHTML = "";

  try {
    status("正在準備文字辨識…");

    if (!worker) {
      worker = await Tesseract.createWorker(
        "chi_tra+eng",
        1,
        {
          logger: message => {
            if (message.status === "recognizing text") {
              status("正在辨識 " +
                Math.round((message.progress || 0) * 100) + "%…");
            }
          }
        }
      );
    }

    const image = source === "camera"
      ? captureGuide()
      : source;

    const result = await worker.recognize(image);
    const recognizedText = result.data.text || "";

    const ranked = rank(recognizedText);
    const best = ranked[0];
    const next = ranked[1];

    if (
      best &&
      best.score >= 0.85 &&
      (!next || best.score - next.score >= 0.2)
    ) {
      status("已找到「" + best.short +
        "」，正在開啟官網商品頁…");

      stopCamera();
      window.location.assign(best.url);
      return;
    }

    status("尚未確認唯一商品，請重新對準或選擇候選商品。");
    showResults(ranked);

  } catch (error) {
    status("辨識失敗：" + error.message);
  } finally {
    busy = false;
    $("action").disabled = false;
  }
}

$("action").addEventListener("click", () => {
  if (cameraReady) {
    scan("camera");
  } else {
    startCamera();
  }
});

$("photo").addEventListener("change", event => {
  const file = event.target.files[0];
  if (file) scan(file);
  event.target.value = "";
});

window.addEventListener("pagehide", stopCamera);

async function initialize() {
  await loadProducts();
  await startCamera();
}

initialize();
</script>
</body>
</html>
