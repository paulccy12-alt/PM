<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145d38"><title>可樂旅遊｜文宣商品辨識</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173b2a;font-family:system-ui,'Noto Sans TC',sans-serif}.app{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:18px 20px;background:#145d38;color:#fff;font-size:19px;font-weight:750}.main{padding:18px;flex:1}.viewer{background:#13221c;position:relative;aspect-ratio:3/4;max-height:65dvh;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#e8f4ec}video{width:100%;height:100%;object-fit:cover} .guide{position:absolute;left:10%;right:10%;top:37%;height:26%;border:2px solid #b2f2bd;border-radius:12px;pointer-events:none;box-shadow:0 0 0 999px #0002}.guide:after{content:'將單一商品名稱置於框內';position:absolute;bottom:-34px;width:100%;text-align:center;color:white;font-size:13px;text-shadow:0 1px 5px #000}.center{text-align:center;padding:24px}.center p{font-size:14px;line-height:1.7}.btn{background:#167647;color:white;border:0;border-radius:12px;padding:15px 20px;font-size:17px;font-weight:700;width:100%;cursor:pointer}.btn:disabled{opacity:.5}.alt{display:block;text-align:center;margin-top:12px;font-size:14px;color:#2b6e4c;cursor:pointer;padding:8px}.alt input{display:none}.status{font-size:14px;color:#426554;line-height:1.65;min-height:28px;margin:12px 2px}.result{background:#fff;border:1px solid #d8e5dc;border-radius:12px;padding:14px;margin:10px 0}.result b{display:block;margin-bottom:6px}.result a{display:block;margin-top:10px;color:#167647;font-weight:700}.small{font-size:12px;color:#648072}.footer{font-size:12px;color:#6a8071;text-align:center;padding:12px}.hide{display:none!important}</style></head><body><div class="app"><header>可樂旅遊｜文宣商品辨識</header><main class="main"><div class="viewer"><video id="camera" autoplay playsinline muted class="hide"></video><div id="intro" class="center"><div style="font-size:48px">▣</div><h2>掃描文宣，立即找商品</h2><p>將鏡頭對準文宣上的單一商品名稱<br>辨識成功後自動開啟官網商品頁</p></div><div id="guide" class="guide hide"></div></div><p class="status" id="status" role="status">準備啟動相機…</p><button id="action" class="btn">開啟相機</button><label class="alt">無法開啟相機？改用拍照／相簿<input id="photo" type="file" accept="image/*" capture="environment"></label><div id="results" aria-live="polite"></div></main><div class="footer">僅在手機上辨識影像；不會上傳照片。請確認網路連線。</div></div><canvas id="capture" class="hide"></canvas><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
// 由管理者更新的商品資料；業務端不需要匯入 Excel。
const products=[{"short":"白川鄉合掌村夢幻點燈5日","name":"白川鄉合掌村夢幻點燈～新穗高纜車、牧歌之里戲雪、庄川峽雪見舟、兼六園溫泉香五日","url":"https://tour.colatour.com.tw/itinerary?PatternNo=246160"},{"short":"東北感蟹季5日","name":"東北感蟹季～松島銀山溫泉、秋田縱貫鐵道、長腳蟹吃到飽、兩晚溫泉飯店五日","url":"https://tour.colatour.com.tw/itinerary?PatternNo=246829"}];
const $=id=>document.getElementById(id);let stream=null,worker=null,busy=false;const status=s=>$('status').textContent=s;function norm(s){return String(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'').replace(/([一二三四五六七八九十])日/g,(_,d)=>({'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10'}[d]||d)+'日')};function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a.includes(b))return 1;const x=new Set([...Array(Math.max(0,a.length-1))].map((_,i)=>a.slice(i,i+2))),y=new Set([...Array(Math.max(0,b.length-1))].map((_,i)=>b.slice(i,i+2)));let hits=0;for(const t of y)if(x.has(t))hits++;return hits/Math.max(y.size,1)}function rank(text){const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),pieces=[text,...lines,...lines.slice(0,-1).map((x,i)=>x+lines[i+1])];return products.map(p=>({...p,score:Math.max(...pieces.map(x=>sim(x,p.short)))})).sort((a,b)=>b.score-a.score)}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('此瀏覽器不支援直接開啟相機，請使用 HTTPS 網址或改用拍照。');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('camera').srcObject=stream;$('camera').classList.remove('hide');$('intro').classList.add('hide');$('guide').classList.remove('hide');$('action').textContent='辨識商品';status('請將單一商品名稱對準框內，再點「辨識商品」。');}catch(e){status('相機無法啟動：'+e.message+'。可改用下方拍照／相簿。')}}async function scan(source){if(busy)return;busy=true;$('action').disabled=true;$('results').innerHTML='';try{status('正在載入繁體中文辨識模型…');if(!worker)worker=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>{if(m.status==='recognizing text')status('正在辨識 '+Math.round((m.progress||0)*100)+'%…')}});let image=source;if(source==='camera'){const v=$('camera'),c=$('capture');if(!v.videoWidth)throw Error('相機尚未準備好');const w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);image=c}const r=await worker.recognize(image),ranked=rank(r.data.text||'');const best=ranked[0],next=ranked[1];if(best&&best.score>=.85&&(!next||best.score-next.score>=.2)){status('已找到「'+best.short+'」，正在開啟官網商品頁…');stop();location.assign(best.url);return}status('尚未確認唯一商品，請選擇結果或重新對準商品名稱掃描。');const list=ranked.filter(x=>x.score>=.3).slice(0,5);if(!list.length){$('results').textContent='找不到相符商品。請靠近商品名稱重新掃描，或確認商品已建檔。';return}for(const p of list){const d=document.createElement('div');d.className='result';const b=document.createElement('b');b.textContent=p.short;const t=document.createElement('div');t.textContent=p.name;const s=document.createElement('div');s.className='small';s.textContent='文字相似度 '+Math.round(p.score*100)+'%（非正確率）';const a=document.createElement('a');a.textContent='開啟這支商品';a.href=p.url;d.append(b,t,s,a);$('results').append(d)}}catch(e){status('辨識失敗：'+e.message)}finally{busy=false;$('action').disabled=false}}$('action').onclick=()=>stream?scan('camera'):start();$('photo').onchange=e=>{const f=e.target.files[0];if(f)scan(f)};window.addEventListener('pagehide',stop);start();
</script></body></html>
